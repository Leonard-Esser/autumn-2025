[project]
name = "autumn-2025"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datetime>=5.5",
    "pandas>=2.3.3",
    "pathlib>=1.0.1",
    "pygit2>=1.19.0",
    "pygithub>=2.8.1",
    "python-dotenv>=1.2.1",
    "torch>=2.9.1",
    "transformers>=4.57.1",
    "typing>=3.10.0.0",
]

[dependency-groups]
lint = [
    "ruff>=0.14.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
